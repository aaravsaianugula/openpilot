name: elantra sync

# Rebuilds master from sunnypilot master with the Elantra 2024-25 port on top.
#
# Weekly, and only from an upstream commit whose own CI went green. If anything in the
# rebuild fails -- the overlay stops applying, the guards trip, opendbc's Hyundai tests
# break -- nothing is pushed and master keeps pointing at the last build that worked.

on:
  schedule:
    # Mondays 09:00 UTC. Weekly keeps on-device recompiles occasional and gives a bad
    # upstream week time to get fixed before it reaches the car.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Pin a specific sunnypilot commit (blank = newest green)"
        required: false
        default: ""
      dry_run:
        description: "Build and validate, publish nothing"
        type: boolean
        default: false
      allow_red_ci:
        description: "Build even if upstream CI is not green"
        type: boolean
        default: false

concurrency:
  group: elantra-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    # Only ever runs in the fork. A fork-of-a-fork should not start force-pushing branches.
    if: github.repository == 'aaravsaianugula/openpilot'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Authenticate git reads for this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Load deploy keys
        env:
          OPENDBC_KEY: ${{ secrets.OPENDBC_DEPLOY_KEY }}
          OPENPILOT_KEY: ${{ secrets.OPENPILOT_DEPLOY_KEY }}
        run: |
          # Both pushes go over SSH, for two different reasons:
          #   opendbc   - GITHUB_TOKEN is scoped to this repo and cannot reach another one.
          #   openpilot - GITHUB_TOKEN can never push a commit that touches .github/workflows.
          #               That is a GitHub App restriction with no permissions flag to unlock,
          #               and mirroring upstream changes workflow files constantly.
          # Each key is write-scoped to exactly one repo, which is narrower than a PAT.
          if [ -z "$OPENDBC_KEY" ] || [ -z "$OPENPILOT_KEY" ]; then
            echo "Missing deploy key secrets (need OPENDBC_DEPLOY_KEY and OPENPILOT_DEPLOY_KEY)." >&2
            echo "Without them the sync cannot publish. Refusing to run." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$OPENDBC_KEY"   > ~/.ssh/opendbc_deploy
          printf '%s\n' "$OPENPILOT_KEY" > ~/.ssh/openpilot_deploy
          chmod 600 ~/.ssh/opendbc_deploy ~/.ssh/openpilot_deploy
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # One host, two identities, so each remote gets its own alias.
          {
            echo "Host opendbc.github.com"
            echo "  HostName github.com"
            echo "  User git"
            echo "  IdentityFile ~/.ssh/opendbc_deploy"
            echo "  IdentitiesOnly yes"
            echo "Host openpilot.github.com"
            echo "  HostName github.com"
            echo "  User git"
            echo "  IdentityFile ~/.ssh/openpilot_deploy"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      # These need no opendbc checkout, so they can run before the sync rather than inside
      # it. Until now only test_port_panel.py reached CI at all: the rest ran only from
      # sync.py, which means they were skipped entirely on any week where nothing changed
      # and the run took the "already current" early return.
      - name: Elantra script tests
        run: |
          python -m pip install -q ruff
          python .elantra/test_port_panel.py
          python .elantra/test_lateral_report.py
          python .elantra/test_steer_headroom.py
          python .elantra/test_guard_opendbc_pin.py
          python -m ruff check .elantra/

      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENDBC_PUSH_URL: git@opendbc.github.com:aaravsaianugula/opendbc.git
          OPENPILOT_PUSH_URL: git@openpilot.github.com:aaravsaianugula/openpilot.git
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.allow_red_ci }}" = "true" ]; then ARGS="$ARGS --allow-red-ci"; fi
          if [ -n "${{ inputs.ref }}" ]; then ARGS="$ARGS --ref ${{ inputs.ref }}"; fi
          python .elantra/sync.py --opendbc-tests $ARGS

      - name: Verify the published branch still supports the car
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .elantra/verify_published.py
